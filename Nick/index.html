  function drawBrick(bx, by, ox, z, col, sq) {
    var h = 1.2 * u * (1 - sq), x0 = -2 + ox, x1 = 2 + ox, y0 = -1, y1 = 1;
    face([iso(bx, by, x0, y1, z), iso(bx, by, x1, y1, z), iso(bx, by, x1, y1, z + h), iso(bx, by, x0, y1, z + h)], shade(col, 0.8));
    face([iso(bx, by, x1, y0, z), iso(bx, by, x1, y1, z), iso(bx, by, x1, y1, z + h), iso(bx, by, x1, y0, z + h)], shade(col, 0.6));
    face([iso(bx, by, x0, y0, z + h), iso(bx, by, x1, y0, z + h), iso(bx, by, x1, y1, z + h), iso(bx, by, x0, y1, z + h)], shade(col, 1));
    var studs = [];
    for (var i = 0; i < 4; i++) for (var j = 0; j < 2; j++) studs.push([x0 + 0.5 + i, y0 + 0.5 + j]);
    studs.sort(function (a, b) { return (a[0] + a[1]) - (b[0] + b[1]); });
    var rx = 0.367 * u, ry = 0.212 * u, sh = 0.2 * u;
    studs.forEach(function (st) {
      var b = iso(bx, by, st[0], st[1], z + h), tp = [b[0], b[1] - sh];
      ctx.fillStyle = shade(col, 0.78);
      ctx.fillRect(b[0] - rx, tp[1], rx * 2, sh);
      ctx.beginPath(); ctx.ellipse(b[0], b[1], rx, ry, 0, 0, Math.PI); ctx.fill();
      ctx.beginPath(); ctx.ellipse(tp[0], tp[1], rx, ry, 0, 0, TAU);
      ctx.fillStyle = shade(col, 1.08); ctx.fill();
      ctx.strokeStyle = "rgba(8,24,70,0.45)"; ctx.lineWidth = 1; ctx.stroke();
    });
  }

  /* Fußball: echte Kugel mit 12 schwarzen Fünfecken, die sich mitdrehen */
  var PHI = (1 + Math.sqrt(5)) / 2, VERTS = [];
  [[0, 1, PHI], [0, 1, -PHI], [0, -1, PHI], [0, -1, -PHI], [1, PHI, 0], [1, -PHI, 0], [-1, PHI, 0], [-1, -PHI, 0], [PHI, 0, 1], [PHI, 0, -1], [-PHI, 0, 1], [-PHI, 0, -1]]
    .forEach(function (v) { var l = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]); VERTS.push([v[0] / l, v[1] / l, v[2] / l]); });

  function drawBall(st, t) {
    var r = ball.r, theta = (st.x - ball.x0) / r, ct = Math.cos(theta), sn = Math.sin(theta), tilt = 0.55, ctl = Math.cos(tilt), snl = Math.sin(tilt);
    var hf = clamp((ball.yFloor - st.y) / (H * 0.3), 0, 1), gy = H * 0.885 + r * 0.05;
    ctx.fillStyle = "rgba(14,44,110," + (0.3 * (1 - hf * 0.8)) + ")";
    ctx.beginPath(); ctx.ellipse(st.x, gy, r * (1 - hf * 0.35), r * 0.26 * (1 - hf * 0.3), 0, 0, TAU); ctx.fill();

    ctx.save(); ctx.translate(st.x, st.y + r); ctx.scale(1 + st.sq * 0.8, 1 - st.sq); ctx.translate(0, -r);
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
    var bg = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.05);
    bg.addColorStop(0, "#ffffff"); bg.addColorStop(0.55, "#eef2f7"); bg.addColorStop(1, "#aab6c6");
    ctx.fillStyle = bg; ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.fillStyle = "#17202e";
    VERTS.forEach(function (v) {
      var x1 = v[0] * ct - v[1] * sn, y1 = v[0] * sn + v[1] * ct, z1 = v[2];
      var y2 = y1 * ctl - z1 * snl, z2 = y1 * snl + z1 * ctl, x2 = x1;
      if (z2 < 0.05) return;
      var len = Math.sqrt(x2 * x2 + y2 * y2) || 1, er = [x2 / len, y2 / len], et = [-er[1], er[0]], pr = r * 0.36;
      ctx.beginPath();
      for (var k = 0; k < 5; k++) {
        var a = k * TAU / 5 + 0.5, pu = pr * Math.cos(a), pv = pr * Math.sin(a) * z2;
        var px = x2 * r + et[0] * pu + er[0] * pv, py = y2 * r + et[1] * pu + er[1] * pv;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    });
    var sg = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    sg.addColorStop(0, "rgba(255,255,255,0.55)"); sg.addColorStop(0.45, "rgba(255,255,255,0)"); sg.addColorStop(1, "rgba(10,30,90,0.4)");
    ctx.fillStyle = sg; ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.restore(); ctx.restore();
  }

  var DAWN_K = 4.5, lastT = 0;
  function render(t, dt) {
    var k = ease(t / DAWN_K);
    var sTop = mix(DAWN.top, DAY.top, k), sMid = mix(DAWN.mid, DAY.mid, k), sLow = mix(DAWN.low, DAY.low, k);
    var warm = 1 - k;

    var sh = 0, i;
    for (i = 0; i < prints.length; i++) { var d = t - prints[i].t; if (d >= 0 && d < 0.3) sh += (1 - d / 0.3) * 3.2 * S; }
    for (i = 0; i < bricks.length; i++) { var db = t - bricks[i].impact; if (bricks[i].impact > 0 && db >= 0 && db < 0.25) sh += (1 - db / 0.25) * 2.2 * S; }
    ctx.save();
    if (sh > 0) ctx.translate(Math.sin(t * 95) * sh, Math.cos(t * 83) * sh);

    var g = ctx.createLinearGradient(0, 0, 0, H * 0.9);
    g.addColorStop(0, rgb(sTop)); g.addColorStop(0.55, rgb(sMid)); g.addColorStop(1, rgb(sLow));
    ctx.fillStyle = g; ctx.fillRect(-14, -14, W + 28, H + 28);

    var sx = W * 0.74, sy = H * lerp(0.70, 0.20, ease(t / 5)), R = clamp(Math.min(W, H) * 0.075, 28, 70);
    var glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * 0.7);
    glow.addColorStop(0, "rgba(255,200,120," + (0.8 - 0.35 * k) + ")"); glow.addColorStop(0.35, "rgba(255,170,90," + (0.25 - 0.1 * k) + ")"); glow.addColorStop(1, "rgba(255,170,90,0)");
    ctx.fillStyle = glow; ctx.fillRect(-14, -14, W + 28, H + 28);
    var disc = ctx.createRadialGradient(sx - R * 0.2, sy - R * 0.2, R * 0.1, sx, sy, R);
    disc.addColorStop(0, "#fff8d8"); disc.addColorStop(0.6, "#ffc15a"); disc.addColorStop(1, "#ff8a1f");
    ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();

    cloudDefs.forEach(function (c) {
      var cw = clamp(W * c.wf, 140, 560), ch = cw / 2;
      var x = ((c.x0 * (W + cw) + t * c.sp * S) % (W + cw)) - cw;
      ctx.globalAlpha = c.a; ctx.drawImage(sprites[c.i], x, H * c.y, cw, ch); ctx.globalAlpha = 1;
    });

    drawLayer(layers[0], t, sLow, warm);
    drawLayer(layers[1], t, sLow, warm);
    drawHill();
    drawSkier(t, dt);

    var gg = ctx.createLinearGradient(0, H * 0.8, 0, H);
    gg.addColorStop(0, "#e9f4ff"); gg.addColorStop(0.45, "#ffffff"); gg.addColorStop(1, "#d3e6fa");
    ctx.fillStyle = gg; ctx.fillRect(-14, H * 0.8, W + 28, H * 0.2 + 14);
    ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.fillRect(-14, H * 0.8 - 1, W + 28, 2);

    for (i = 0; i < prints.length; i++) drawPrint(prints[i], t);

    /* Lego-Turm unten rechts */
    var bx = W * (W > H ? 0.8 : 0.77), by = H * 0.905;
    var cols = [[255, 138, 31], [31, 107, 255], [255, 210, 63]], offs = [0, 1, 0];
    var landed = bricks[0].impact > 0 && t > bricks[0].impact;
    if (landed || bricks[0].arr[Math.min(NSTEP - 1, Math.floor(t / DT))]) {
      ctx.fillStyle = "rgba(14,44,110,0.2)";
      ctx.beginPath(); ctx.ellipse(bx + u * 0.4, by + u * 1.1, u * 3.4, u * 1.2, 0, 0, TAU); ctx.fill();
    }
    for (i = 0; i < bricks.length; i++) {
      var idx = Math.min(NSTEP - 1, Math.floor(t / DT)), bs = bricks[i].arr[idx];
      if (!bs) continue;
      ctx.save(); ctx.translate(0, bs.dy); drawBrick(bx, by, offs[i], i * 1.2 * u, cols[i], bs.sq); ctx.restore();
      if (bricks[i].impact > 0 && lastT < bricks[i].impact && t >= bricks[i].impact) {
        var p = iso(bx, by, 0, 1, i * 1.2 * u);
        for (var n = 0; n < 12; n++) parts.push({ x: p[0] + (Math.random() - 0.5) * u * 4, y: p[1], vx: (Math.random() - 0.5) * 120 * S, vy: -(20 + Math.random() * 70) * S, life: 0.5 + Math.random() * 0.4, max: 0.9, r: 1.2 + Math.random() * 2.4 });
      }
    }

    var bst = ball.states[Math.min(NSTEP - 1, Math.floor(t / DT))];
    if (bst.vis) drawBall(bst, t);

    /* Partikel (Schneestaub) */
    for (i = parts.length - 1; i >= 0; i--) {
      var pp = parts[i]; pp.life -= dt; if (pp.life <= 0) { parts.splice(i, 1); continue; }
      pp.x += pp.vx * dt; pp.y += pp.vy * dt; pp.vy += 220 * dt;
      ctx.fillStyle = "rgba(255,255,255," + clamp(pp.life / pp.max, 0, 1) * 0.9 + ")";
      ctx.beginPath(); ctx.arc(pp.x, pp.y, pp.r, 0, TAU); ctx.fill();
    }

    /* Schneefall (vorne) */
    for (i = 0; i < snow.length; i++) {
      var f = snow[i];
      f.y += (35 + 95 * f.z) * S * dt; f.x += (Math.sin(t * 0.5 + f.ph) * 14 * f.z + (10 + 18 * f.z) * S) * dt;
      if (f.y > H + 6) { f.y = -6; f.x = Math.random() * W; }
      if (f.x > W + 6) f.x = -6;
      ctx.fillStyle = "rgba(255,255,255," + (0.35 + 0.55 * f.z) + ")";
      ctx.beginPath(); ctx.arc(f.x, f.y, 0.8 + 2.4 * f.z, 0, TAU); ctx.fill();
    }
    ctx.restore();
    lastT = t;
  }

  /* ---------- Start / Stop ---------- */
  var raf = 0, startTime = 0, prev = 0, running = false;
  function frame(now) {
    if (!running) return;
    if (!startTime) { startTime = now; prev = now; }
    var t = (now - startTime) / 1000, dt = Math.min(0.05, (now - prev) / 1000);
    prev = now;
    render(t, dt);
    raf = requestAnimationFrame(frame);
  }
  function stop() { running = false; cancelAnimationFrame(raf); }
  document.addEventListener("intro:stop", stop);

  var rt = 0;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { resize(); if (reduce) render(7, 0); }, 120); });

  resize();
  if (reduce) { render(7, 0); }
  else { running = true; raf = requestAnimationFrame(frame); }
})();
</script>

      var d = g.getImageData(0, 0, w, h), p = d.data, seen = new Uint8Array(w * h), stack = [], removed = 0, i, x, y;
      function isBg(k) { var r = p[k * 4], gg = p[k * 4 + 1], b = p[k * 4 + 2], mn = Math.min(r, gg, b); return mn >= 230 && Math.max(r, gg, b) - mn < 18; }
      for (x = 0; x < w; x++) stack.push(x, (h - 1) * w + x);
      for (y = 0; y < h; y++) stack.push(y * w, y * w + w - 1);
      var whiteBorder = 0;
      for (i = 0; i < stack.length; i++) if (isBg(stack[i])) whiteBorder++;
      if (whiteBorder / stack.length < 0.5) { cutCache[key] = false; return; }   /* Rand nicht überwiegend weiß: kein Hintergrund */
      while (stack.length) {
        i = stack.pop(); if (seen[i]) continue; seen[i] = 1;
        if (!isBg(i)) continue;
        p[i * 4 + 3] = 0; removed++;
        x = i % w; y = (i - x) / w;
        if (x > 0) stack.push(i - 1); if (x < w - 1) stack.push(i + 1);
        if (y > 0) stack.push(i - w); if (y < h - 1) stack.push(i + w);
      }
      if (removed / (w * h) < 0.02) { cutCache[key] = false; return; }   /* kein weißer Rand: Bild bleibt wie es ist */
      for (var pass = 0; pass < 2; pass++) {                                 /* weiche Kanten statt weißem Saum */
        var soft = [];
        for (i = 0; i < w * h; i++) {
          if (p[i * 4 + 3] !== 255) continue;
          x = i % w; y = (i - x) / w;
          var edge = (x > 0 && p[(i - 1) * 4 + 3] < 255) || (x < w - 1 && p[(i + 1) * 4 + 3] < 255) || (y > 0 && p[(i - w) * 4 + 3] < 255) || (y < h - 1 && p[(i + w) * 4 + 3] < 255);
          if (!edge) continue;
          var mn = Math.min(p[i * 4], p[i * 4 + 1], p[i * 4 + 2]);
          if (mn > 170) soft.push(i, Math.max(0, Math.round(255 * (255 - mn) / 85)));
        }
        for (var s2 = 0; s2 < soft.length; s2 += 2) p[soft[s2] * 4 + 3] = soft[s2 + 1];
      }
      g.putImageData(d, 0, 0);
      cutCache[key] = c.toDataURL("image/png");
      img.src = cutCache[key];
    } catch (e) { cutCache[key] = false; }
  }

  function makeImage(g, pic) {
    var img = document.createElement("img");
    var eingebaut = (typeof BILDER !== "undefined") && BILDER[g.bild];
    img.alt = g.name; img.decoding = "async";
    if (eingebaut) {
      img.addEventListener("load", function () { pic.classList.add("has-img"); });
      img.addEventListener("error", function () { img.remove(); pic.classList.remove("has-img"); });
      img.src = eingebaut;
      return img;
    }
    var triedPlain = false;
    img.loading = "lazy";
    img.crossOrigin = "anonymous";
    img.addEventListener("load", function () {
      pic.classList.add("has-img");
      if (!img.dataset.done) { img.dataset.done = "1"; if (!triedPlain) freistellen(img, g.bild); }
    });
    img.addEventListener("error", function () {
      if (!triedPlain) { triedPlain = true; img.removeAttribute("crossorigin"); img.src = g.bild; return; }
      img.remove(); pic.classList.remove("has-img");
    });
    img.src = g.bild;
    return img;
  }

  /* ---------- Liste anzeigen ---------- */
  function renderChips(items) {
    chipsBox.textContent = "";
    var used = [];
    items.forEach(function (g) { if (used.indexOf(g.thema) === -1) used.push(g.thema); });
    if (used.length < 2) return;
    function makeChip(value, label) {
      var c = el("button", "chip", label);
      c.type = "button";
      c.setAttribute("aria-pressed", String(currentThema === value));
      c.addEventListener("click", function () {
        currentThema = value;
        renderChips(items);
        renderGrid();
      });
      chipsBox.appendChild(c);
    }
    makeChip("alle", "Alle");
    used.forEach(function (t) {
      var th = THEMEN[t] || THEMEN.sonstiges;
      makeChip(t, th.emoji + " " + th.name);
    });
  }

  function renderGrid() {
    var items = GESCHENKE.filter(function (g) { return g.kategorie === currentKey; });
    if (currentThema !== "alle") items = items.filter(function (g) { return g.thema === currentThema; });

    var sort = sortSelect.value;
    if (sort === "auf") items.sort(function (a, b) { return a.preis - b.preis; });
    if (sort === "ab")  items.sort(function (a, b) { return b.preis - a.preis; });

    grid.textContent = "";
    if (!items.length) {
      grid.appendChild(el("div", "empty", "Hier ist noch nichts drin. Schau bald wieder vorbei!"));
      return;
    }
    items.forEach(function (g) {
      var th = THEMEN[g.thema] || THEMEN.sonstiges;
      var card = el("article", "card cut");

      var pic = el("div", "card-pic");
      pic.appendChild(el("span", "card-emoji", th.emoji));
      if (g.bild) pic.appendChild(makeImage(g, pic));
      pic.appendChild(el("span", "card-price" + (g.preis > 0 ? "" : " card-price-free"), preisText(g.preis)));
      if (g.link) {
        var picLink = el("a", "card-pic-link");
        picLink.href = g.link; picLink.target = "_blank"; picLink.rel = "noopener noreferrer";
        picLink.setAttribute("aria-label", g.name + " im Shop ansehen");
        picLink.appendChild(pic);
        card.appendChild(picLink);
      } else {
        card.appendChild(pic);
      }

      var bodyEl = el("div", "card-body");
      bodyEl.appendChild(el("span", "card-theme", th.emoji + " " + th.name));
      bodyEl.appendChild(el("h3", "card-name", g.name));
      bodyEl.appendChild(el("p", "card-text", g.beschreibung || ""));

      if (g.link) {
        var a = el("a", "buy-btn", "Zum Produkt");
        a.insertAdjacentHTML("beforeend", ICONS.extern);
        a.href = g.link; a.target = "_blank"; a.rel = "noopener noreferrer";
        bodyEl.appendChild(a);
      } else {
        bodyEl.appendChild(el("div", "free-note", "Kostet nichts, nur ein bisschen Zeit und Lust!"));
      }
      card.appendChild(bodyEl);
      grid.appendChild(card);
    });
  }

  function showList(key) {
    currentKey = key; currentThema = "alle"; sortSelect.value = "standard";
    var k = KATEGORIEN[key];
    document.getElementById("listTitle").textContent = k.titel;
    listSection.style.setProperty("--accent", k.farbe || "#3d8bff");
    document.getElementById("listSub").textContent = k.untertitel;
    var items = GESCHENKE.filter(function (g) { return g.kategorie === key; });
    sortLabel.hidden = (key === "gratis");
    document.getElementById("priceNote").hidden = (key === "gratis");
    renderChips(items);
    renderGrid();
    home.hidden = true; listSection.hidden = false;
    listSection.classList.remove("view-in"); void listSection.offsetWidth; listSection.classList.add("view-in");
    window.scrollTo(0, 0);
  }

  function showHome() {
    listSection.hidden = true; home.hidden = false;
    home.classList.remove("view-in"); void home.offsetWidth; home.classList.add("view-in");
    window.scrollTo(0, 0);
  }

  function route() {
    var key = location.hash.slice(1);
    if (KATEGORIEN[key]) showList(key); else showHome();
  }
  window.addEventListener("hashchange", route);
  sortSelect.addEventListener("change", renderGrid);
  document.getElementById("backBtn").addEventListener("click", function () {
    if (history.length > 1 && location.hash) history.back(); else location.hash = "";
  });

  /* ---------- Wolken-Übergang (echte, weiche Wolken) ---------- */
  function buildClouds() {
    var urls = window.NICK_CLOUD_URLS || [];
    if (!urls.length) return;
    var cols = 6, rows = 9;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var cx = c * 20 + (Math.random() * 6 - 3) + (r % 2 ? 4 : -2);
        var cy = r * (100 / (rows - 1)) + (Math.random() * 4 - 2);
        var dx = cx - 50, dy = cy - 50;
        if (Math.abs(dx) < 6) dx = (Math.random() < .5 ? -1 : 1) * 12;
        var cl = document.createElement("img");
        cl.className = "cloud"; cl.alt = ""; cl.decoding = "async";
        cl.src = urls[(r * cols + c) % urls.length];
        cl.style.left = cx + "%";
        cl.style.top = cy + "%";
        cl.style.setProperty("--ox", (dx * 2.4) + "vw");
        cl.style.setProperty("--oy", (dy * 2.0) + "vh");
        cl.style.transitionDelay = (Math.random() * 0.4).toFixed(2) + "s";
        cloudsBox.appendChild(cl);
      }
    }
  }

  var started = false;
  function openApp() {
    if (started) return;
    started = true;
    buildClouds();
    void cloudsBox.offsetWidth;
    cloudsBox.classList.add("cover");
    setTimeout(function () {
      intro.style.display = "none";
      document.dispatchEvent(new Event("intro:stop"));
      body.classList.remove("is-intro");
      app.classList.add("is-open");
      cloudsBox.classList.remove("cover");
      cloudsBox.classList.add("open");
    }, reduceMotion ? 50 : 1900);
    setTimeout(function () { cloudsBox.remove(); }, reduceMotion ? 200 : 4400);
  }
  document.getElementById("startBtn").addEventListener("click", openApp);

  /* ---------- Start ---------- */
  if (KATEGORIEN[location.hash.slice(1)]) {
    /* Wer einen Direktlink zu einer Liste öffnet, überspringt die Intro. */
    intro.style.display = "none";
    cloudsBox.remove();
    body.classList.remove("is-intro");
    app.classList.add("is-open");
    document.querySelectorAll(".cat-btn").forEach(function (b) { b.classList.add("no-intro"); });
  }
  route();
})();
</script>
</body>
